name: pipeline
on:
  workflow_dispatch:
jobs:
  run_pipeline:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.11"
        - run: pip install -r requirements.txt
        - run: python -m pipeline.run
          env:
            DATABASE_URL: ${{secrets.DATABASE_URL}}
      

